    <circle cx="90" cy="60" r="1.2" fill="#f6e3d3" opacity="0.50"><animate attributeName="opacity" values="0.50;0.15;0.50" dur="3s" begin="0.00s" repeatCount="indefinite"/></circle><circle cx="210" cy="250" r="1" fill="#f6e3d3" opacity="0.35"><animate attributeName="opacity" values="0.35;0.10;0.35" dur="4s" begin="0.37s" repeatCount="indefinite"/></circle><circle cx="330" cy="40" r="1.4" fill="#f6e3d3" opacity="0.45"><animate attributeName="opacity" values="0.45;0.14;0.45" dur="5s" begin="0.74s" repeatCount="indefinite"/></circle><circle cx="560" cy="290" r="1" fill="#f6e3d3" opacity="0.30"><animate attributeName="opacity" values="0.30;0.09;0.30" dur="6s" begin="1.11s" repeatCount="indefinite"/></circle><circle cx="1180" cy="70" r="1.3" fill="#f6e3d3" opacity="0.50"><animate attributeName="opacity" values="0.50;0.15;0.50" dur="3s" begin="1.48s" repeatCount="indefinite"/></circle><circle cx="1060" cy="250" r="1" fill="#f6e3d3" opacity="0.35"><animate attributeName="opacity" values="0.35;0.10;0.35" dur="4s" begin="1.85s" repeatCount="indefinite"/></circle><circle cx="980" cy="40" r="1.1" fill="#f6e3d3" opacity="0.40"><animate attributeName="opacity" values="0.40;0.12;0.40" dur="5s" begin="2.22s" repeatCount="indefinite"/></circle><circle cx="1230" cy="220" r="1.4" fill="#f6e3d3" opacity="0.45"><animate attributeName="opacity" values="0.45;0.14;0.45" dur="6s" begin="2.59s" repeatCount="indefinite"/></circle><circle cx="700" cy="30" r="1" fill="#f6e3d3" opacity="0.30"><animate attributeName="opacity" values="0.30;0.09;0.30" dur="3s" begin="2.96s" repeatCount="indefinite"/></circle><circle cx="640" cy="280" r="1.2" fill="#f6e3d3" opacity="0.35"><animate attributeName="opacity" values="0.35;0.10;0.35" dur="4s" begin="3.33s" repeatCount="indefinite"/></circle><circle cx="150" cy="150" r="1" fill="#f6e3d3" opacity="0.30"><animate attributeName="opacity" values="0.30;0.09;0.30" dur="5s" begin="3.70s" repeatCount="indefinite"/></circle><circle cx="1120" cy="160" r="1" fill="#f6e3d3" opacity="0.30"><animate attributeName="opacity" values="0.30;0.09;0.30" dur="6s" begin="4.07s" repeatCount="indefinite"/></circle><circle cx="860" cy="290" r="1.2" fill="#f6e3d3" opacity="0.35"><animate attributeName="opacity" values="0.35;0.10;0.35" dur="3s" begin="4.44s" repeatCount="indefinite"/></circle>
