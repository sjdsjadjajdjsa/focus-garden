      <circle r="10" fill="url(#sun)" stroke="#ffffff" stroke-opacity="0.5" stroke-width="1.2"/>
      <animateTransform attributeName="transform" type="translate" dur="9s" repeatCount="indefinite" values="240.0 232.0;241.4 211.1;245.5 190.6;252.2 170.8;261.4 152.0;273.1 134.6;286.9 118.9;302.6 105.1;320.0 93.4;338.8 84.2;358.6 77.5;379.1 73.4;400.0 72.0;420.9 73.4;441.4 77.5;461.2 84.2;480.0 93.4;497.4 105.1;513.1 118.9;526.9 134.6;538.6 152.0;547.8 170.8;554.5 190.6;558.6 211.1;560.0 232.0;560.0 232.0" keyTimes="0.0000;0.0354;0.0708;0.1062;0.1417;0.1771;0.2125;0.2479;0.2833;0.3187;0.3542;0.3896;0.4250;0.4604;0.4958;0.5312;0.5667;0.6021;0.6375;0.6729;0.7083;0.7437;0.7792;0.8146;0.8500;1"/>
    </g>
    <!-- pot -->
    <ellipse cx="400" cy="303" rx="62" ry="7" fill="#000000" opacity="0.35"/>
    <path d="M346,240 L454,240 L444,296 Q443,302 436,302 L364,302 Q357,302 356,296 Z" fill="url(#pot)"/>
    <rect x="348" y="256" width="104" height="4" fill="#f8c2ad" opacity="0.85"/>
    <rect x="338" y="224" width="124" height="18" rx="5" fill="url(#rim)"/>
    <line x1="344" y1="227" x2="456" y2="227" stroke="#ffffff" stroke-opacity="0.45" stroke-width="1.5"/>
    <ellipse cx="400" cy="224" rx="56" ry="6" fill="#4a3526"/>
    <!-- tulip, swaying -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-1.6 400 224;1.6 400 224;-1.6 400 224" dur="5.5s" repeatCount="indefinite"/>
      <path d="M398,224 C368,212 348,182 346,140 C364,164 386,192 398,224 Z" fill="url(#leafL)"/>
      <path d="M402,224 C430,210 450,188 456,150 C438,174 416,198 402,224 Z" fill="url(#leafR)"/>
      <path d="M400,224 Q396,166 404,106" fill="none" stroke="#3f8a45" stroke-width="5" stroke-linecap="round"/>
      <path d="M399,222 Q395,166 403,108" fill="none" stroke="#8fd27d" stroke-opacity="0.7" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M404,110 C388,108 376,92 380,64 C392,72 402,88 404,110 Z" fill="url(#petalBack)"/>
      <path d="M404,110 C420,108 432,92 428,64 C416,72 406,88 404,110 Z" fill="url(#petalBack)"/>
      <path d="M404,112 C388,104 386,78 404,56 C422,78 420,104 404,112 Z" fill="url(#petal)"/>
      <path d="M404,104 Q406,84 404,66" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.4" stroke-linecap="round"/>
