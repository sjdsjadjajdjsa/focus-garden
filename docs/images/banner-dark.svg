    <text x="620" y="166" font-family="ui-monospace, 'JetBrains Mono', SFMono-Regular, Menlo, monospace" font-size="78" font-weight="700" fill="#f4e9e1" letter-spacing="-2">focus garden</text>
    <text x="624" y="212" font-family="ui-monospace, 'JetBrains Mono', SFMono-Regular, Menlo, monospace" font-size="22" fill="#b8a297">grow a little plant while you focus</text>
  </g>
