<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Focus Garden: grow a little plant while you focus">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a201d"/><stop offset="1" stop-color="#140f0d"/></linearGradient>
    <radialGradient id="ground" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#f38d70" stop-opacity="0.28"/><stop offset="1" stop-color="#f38d70" stop-opacity="0"/></radialGradient>
    <radialGradient id="sunglow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ffc94d" stop-opacity="0.55"/><stop offset="1" stop-color="#ffc94d" stop-opacity="0"/></radialGradient>
    <radialGradient id="sun" cx="0.35" cy="0.35" r="0.7"><stop offset="0" stop-color="#fff1c2"/><stop offset="1" stop-color="#f6b94a"/></radialGradient>
    <linearGradient id="pot" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e9a48c"/><stop offset="0.4" stop-color="#d98f76"/><stop offset="1" stop-color="#9d5d4a"/></linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f2b9a2"/><stop offset="1" stop-color="#cf8670"/></linearGradient>
    <linearGradient id="leafL" x1="1" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#3f8a45"/><stop offset="0.6" stop-color="#5fb35a"/><stop offset="1" stop-color="#8fd27d"/></linearGradient>
    <linearGradient id="leafR" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#357a3c"/><stop offset="0.6" stop-color="#54a650"/><stop offset="1" stop-color="#82c672"/></linearGradient>
    <linearGradient id="petal" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#d9694c"/><stop offset="0.6" stop-color="#f38d70"/><stop offset="1" stop-color="#fdc9b5"/></linearGradient>
    <linearGradient id="petalBack" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#b85a42"/><stop offset="1" stop-color="#e8846a"/></linearGradient>
    <clipPath id="r"><rect width="1280" height="320" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#r)">
